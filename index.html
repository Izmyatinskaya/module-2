<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя первая страница</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            color: #333;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        button {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет, мир! 👋</h1>
        <p>Это моя первая HTML-страница, созданная в рамках обучения.</p>

        <h2>Что я уже умею:</h2>
        <ul>
            <li>Работать с Git и GitHub</li>
            <li>Настраивать SSH-ключи</li>
            <li>Делать коммиты и пушить изменения</li>
            <li>Создавать HTML-страницы</li>
        </ul>

        <button onclick="alert('Кнопка работает! 🎉')">Нажми меня</button>
    </div>
</body>
</html>
